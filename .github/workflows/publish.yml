# Builds a final release version on every supported OS and pushes to nuget.org
# whenever a release is published. Packages are pushed only after the whole matrix passes.
# Requires: vars.NUGET_OIDC (or secrets.NUGET_OIDC) and a nuget.org trusted publishing policy

name: publish
on:
  release:
    types: [prereleased, released]

env:
  DOTNET_NOLOGO: true
  Configuration: Release

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
    steps:
      - name: 🤘 checkout
        uses: actions/checkout@v4
        with: 
          submodules: recursive
          fetch-depth: 0

      - name: ⚙ dotnet
        uses: devlooped/actions-dotnet-env@v1

      - name: 🙏 build
        run: dotnet build -m:1 -bl:build.binlog -p:version=${GITHUB_REF#refs/*/v} -p:RepositoryBranch=${GITHUB_REF#refs/*/}

      - name: 🧪 test
        run: dotnet test --no-build -m:1

      - name: 📦 pack
        run: dotnet pack -m:1 -bl:pack.binlog -p:version=${GITHUB_REF#refs/*/v} -p:RepositoryBranch=${GITHUB_REF#refs/*/}

      - name: 🔼 logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.os }}
          path: '*.binlog'

      - name: ✅ validate
        shell: pwsh
        working-directory: bin
        run: |
          $invalid = Get-ChildItem -File -Filter "*.42.42*.nupkg"
          if ($invalid) {
            Write-Error "Found dev/local packages with disallowed 42.42* version prefix:`n$($invalid.Name -join "`n")"
            exit 1
          }

      - name: 🔼 packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: bin-ubuntu-latest
          path: bin/*.nupkg

  # Pushes with nuget.org Trusted Publishing (GitHub Actions OIDC), no long-lived API key.
  # Only this job may request an OIDC token. The nuget.org policy, created by the
  # NuGet/login user (vars.NUGET_OIDC, or secrets.NUGET_OIDC when the variable is empty),
  # must match:
  #   Package owner: Devlooped
  #   Repository owner: devlooped
  #   Repository: stunts
  #   Workflow file: publish.yml
  #   Environment: nuget
  #   Scope: Push new packages and package versions
  #   Glob patterns and packages: Stunts, Stunts.*, ManualStunts
  # The nuget GitHub environment must allow the release tag ref (refs/tags/<tag_name>).
  # https://learn.microsoft.com/nuget/nuget-org/trusted-publishing
  # https://github.com/NuGet/login
  publish:
    needs: build
    if: github.event.action != 'prereleased'
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 🔽 packages
        uses: actions/download-artifact@v4
        with:
          name: bin-ubuntu-latest
          path: bin

      - name: 🔑 nuget login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_OIDC || secrets.NUGET_OIDC }}

      - name: 🚀 nuget
        run: dotnet nuget push ./bin/**/*.nupkg -s https://api.nuget.org/v3/index.json -k ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate
