# Builds and runs tests in all three supported OSes
# Pushes CI feed if secrets.SLEET_CONNECTION is provided

name: build
on: 
  workflow_dispatch:
  push:
    branches: [ main, dev, 'feature/*', 'rel/*' ]
    paths-ignore:
      - changelog.md
      - readme.md
  pull_request:
    types: [opened, synchronize, reopened]

env:
  DOTNET_NOLOGO: true

defaults:
  run:
    shell: bash

jobs:
  dotnet-format:
    runs-on: ubuntu-latest
    steps:
      - name: 🤘 checkout
        uses: actions/checkout@v4
        with: 
          submodules: recursive
          fetch-depth: 0

      - name: ⚙ dotnet
        uses: devlooped/actions-dotnet-env@v1

      - name: ✓ ensure format
        run: |
          dotnet format whitespace --verify-no-changes -v:diag --exclude ~/.nuget
          dotnet format style --verify-no-changes -v:diag --exclude ~/.nuget

  build:
    name: build-${{ matrix.os }}
    needs: dotnet-format
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
    steps:
      - name: 🤘 checkout
        uses: actions/checkout@v4
        with: 
          submodules: recursive
          fetch-depth: 0

      - name: ⚙ dotnet
        uses: devlooped/actions-dotnet-env@v1

      - name: 🙏 build
        run: dotnet build -m:1 -bl:build.binlog -p:VersionLabel="$GITHUB_REF.$GITHUB_RUN_NUMBER" -p:RepositoryBranch=${GITHUB_REF#refs/*/}

      - name: 🧪 test
        run: dotnet test --no-build -m:1 --blame-hang --blame-hang-timeout 5m -d $GITHUB_WORKSPACE/logs/${{ matrix.os }}.txt -r $GITHUB_WORKSPACE/logs

      - name: 📦 pack
        run: dotnet pack -m:1 -bl:pack.binlog -p:VersionLabel="$GITHUB_REF.$GITHUB_RUN_NUMBER" -p:RepositoryBranch=${GITHUB_REF#refs/*/}

      - name: 🔼 packages
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.os }}
          path: bin/*.nupkg
      
      # Only push CI package to sleet feed if building on ubuntu (fastest)
      - name: 🚀 sleet
        env:
          SLEET_CONNECTION: ${{ secrets.SLEET_CONNECTION }}
        if: matrix.os == 'ubuntu-latest' && env.SLEET_CONNECTION != ''
        run: |
          dotnet tool update sleet -g --allow-downgrade --version $(curl -s --compressed ${{ vars.SLEET_FEED_URL }} | jq '.["sleet:version"]' -r) 
          sleet push bin --config none -f --verbose -p "SLEET_FEED_CONTAINER=nuget" -p "SLEET_FEED_CONNECTIONSTRING=${{ secrets.SLEET_CONNECTION }}" -p "SLEET_FEED_TYPE=azure" || echo "No packages found"

  acceptance:
    name: acceptance-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
    steps:
      - name: 🤘 checkout
        uses: actions/checkout@v4

      - name: ⚙ dotnet
        uses: devlooped/actions-dotnet-env@v1

      - name: 🔽 packages
        uses: actions/download-artifact@v4
        with:
          name: bin-${{ matrix.os }}
          path: bin

      - name: 🧪 test
        run: dotnet test -p:VersionLabel="$GITHUB_REF.$GITHUB_RUN_NUMBER"
        working-directory: src/Acceptance

  preview:
    defaults:
      run:
        shell: pwsh
    needs: dotnet-format
    runs-on: windows-latest

    steps:
      - name: 🤘 checkout
        uses: actions/checkout@v4

      - name: ⚙ dotnet
        uses: devlooped/actions-dotnet-env@v1

      # > VS Preview
      - name: 🔽 dotnet-vs
        run: dotnet tool update -g dotnet-vs
      - name: 🔽 vs preview
        run: vs install preview --quiet +Microsoft.VisualStudio.Component.ManagedDesktop.Core +Microsoft.NetCore.Component.DevelopmentTools
      - name: ≥ msbuild
        run: echo "$(vs where preview --prop=InstallationPath)\MSBuild\Current\Bin" >> $env:GITHUB_PATH
      # < VS Preview

      - name: ⚙ curl
        run: |
          iwr -useb get.scoop.sh | iex
          scoop install curl
      - name: 🔍 status for PR
        if: ${{ github.event.pull_request.head.sha }}
        run: echo "STATUS_SHA=${{ github.event.pull_request.head.sha }}" >> $env:GITHUB_ENV

      - name: 🔍 status for branch
        if: ${{ !github.event.pull_request.head.sha }}
        run: echo "STATUS_SHA=$($env:GITHUB_SHA)" >> $env:GITHUB_ENV

      - name: ⌛ wait on build
        env:
          CHECK: build-windows-latest
          SHA: ${{ env.STATUS_SHA }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.github/workflows/wait-status.ps1

      - name: ⌛ wait on acceptance
        env:
          CHECK: acceptance-windows-latest
          SHA: ${{ env.STATUS_SHA }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.github/workflows/wait-status.ps1

      - name: 🔽 packages
        uses: actions/download-artifact@v4
        with:
          name: bin-windows-latest
          path: bin

      - name: 🧪 test
        run: msbuild -r -t:build,test -p:TargetFramework=net48 -p:VersionLabel="$($env:GITHUB_REF).$($env:GITHUB_RUN_NUMBER)"
        working-directory: src/Acceptance
