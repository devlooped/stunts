# Builds and runs tests on Ubuntu. The full OS matrix runs in publish and release.
# Pushes CI feed if secrets.SLEET_CONNECTION is provided

name: build
on: 
  workflow_dispatch:
  push:
    branches: [ main, dev, 'feature/*', 'rel/*' ]
    paths-ignore:
      - changelog.md
      - readme.md
  pull_request:
    types: [opened, synchronize, reopened]

env:
  DOTNET_NOLOGO: true

defaults:
  run:
    shell: bash

jobs:
  dotnet-format:
    runs-on: ubuntu-latest
    steps:
      - name: 🤘 checkout
        uses: actions/checkout@v4
        with: 
          submodules: recursive
          fetch-depth: 0

      - name: ⚙ dotnet
        uses: devlooped/actions-dotnet-env@v1

      - name: ✓ ensure format
        run: |
          dotnet format whitespace --verify-no-changes -v:diag --exclude ~/.nuget
          dotnet format style --verify-no-changes -v:diag --exclude ~/.nuget

  build:
    name: build
    needs: dotnet-format
    runs-on: ubuntu-latest
    steps:
      - name: 🤘 checkout
        uses: actions/checkout@v4
        with: 
          submodules: recursive
          fetch-depth: 0

      - name: ⚙ dotnet
        uses: devlooped/actions-dotnet-env@v1

      - name: 🙏 build
        run: dotnet build -m:1 -bl:build.binlog -p:VersionLabel="$GITHUB_REF.$GITHUB_RUN_NUMBER" -p:RepositoryBranch=${GITHUB_REF#refs/*/}

      - name: 🧪 test
        run: dotnet test --no-build -m:1 --blame-hang --blame-hang-timeout 5m -d $GITHUB_WORKSPACE/logs/ubuntu-latest.txt --results-directory $GITHUB_WORKSPACE/logs

      - name: 📦 pack
        run: dotnet pack -m:1 -bl:pack.binlog -p:VersionLabel="$GITHUB_REF.$GITHUB_RUN_NUMBER" -p:RepositoryBranch=${GITHUB_REF#refs/*/}

      - name: 🔼 packages
        uses: actions/upload-artifact@v4
        with:
          name: bin-ubuntu-latest
          path: bin/*.nupkg
      
      # Push the CI package to the sleet feed when a connection is configured
      - name: 🚀 sleet
        env:
          SLEET_CONNECTION: ${{ secrets.SLEET_CONNECTION }}
        if: env.SLEET_CONNECTION != ''
        run: |
          dotnet tool update sleet -g --allow-downgrade --version $(curl -s --compressed ${{ vars.SLEET_FEED_URL }} | jq '.["sleet:version"]' -r) 
          sleet push bin --config none -f --verbose -p "SLEET_FEED_CONTAINER=nuget" -p "SLEET_FEED_CONNECTIONSTRING=${{ secrets.SLEET_CONNECTION }}" -p "SLEET_FEED_TYPE=azure" || echo "No packages found"

  native-aot:
    name: native-aot-${{ matrix.framework }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        framework: [net8.0, net10.0]
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: dotnet
        uses: devlooped/actions-dotnet-env@v1
      - name: packages
        uses: actions/download-artifact@v4
        with:
          name: bin-ubuntu-latest
          path: bin
      - name: publish and execute
        run: |
          dotnet publish src/Acceptance/CompiledAot/CompiledAot.csproj -c Release -f ${{ matrix.framework }} -r linux-x64 -p:UseSharedCompilation=false -warnaserror -p:VersionLabel="$GITHUB_REF.$GITHUB_RUN_NUMBER"
          src/Acceptance/CompiledAot/bin/Release/${{ matrix.framework }}/linux-x64/publish/CompiledAot

  acceptance:
    name: acceptance
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 🤘 checkout
        uses: actions/checkout@v4

      - name: ⚙ dotnet
        uses: devlooped/actions-dotnet-env@v1

      - name: 🔽 packages
        uses: actions/download-artifact@v4
        with:
          name: bin-ubuntu-latest
          path: bin

      - name: 🏗 generate comparison stunts
        run: dotnet run --file GenerateReferenceStunts.cs
        working-directory: src/Acceptance

      - name: 🧪 test
        run: dotnet test Acceptance.slnx -f net10.0 -p:VersionLabel="$GITHUB_REF.$GITHUB_RUN_NUMBER"
        working-directory: src/Acceptance
